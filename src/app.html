<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
		     anything other than zero, which the bottom nav relies on. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta
			name="text-scale"
			content="scale"
		/>
		<link
			rel="icon"
			href="%sveltekit.assets%/icon.svg"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.webmanifest"
		/>
		<meta
			name="theme-color"
			media="(prefers-color-scheme: light)"
			content="#059669"
		/>
		<meta
			name="theme-color"
			media="(prefers-color-scheme: dark)"
			content="#0b0f1a"
		/>
		<!-- Applies the stored theme before the stylesheet paints, so a dark
		     launch never flashes light. Must stay inline and ahead of the CSS;
		     the app's own code takes over in $lib/theme.svelte.ts. -->
		<script>
			try {
				var theme = localStorage.getItem('hundkoll:theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
				}
			} catch (e) {}
		</script>
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="default"
		/>
		<meta
			name="apple-mobile-web-app-title"
			content="Hundkoll"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
